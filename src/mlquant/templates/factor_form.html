{% extends "base.html" %}
{% block title %}编辑因子 · MLQuant{% endblock %}
{% block content %}<section class="hero compact"><div><p class="eyebrow">FORMULA EDITOR</p><h1>{% if factor %}编辑 {{ factor.name }}{% else %}新建因子{% endif %}</h1><p>保存前同步完成语法、字段、算子和依赖检查；有效保存立即生成不可变 revision。</p></div></section>
{% if error %}<div class="alert">{{ error }}</div>{% endif %}
<form class="editor panel" method="post" action="/factors/save">
<label>Factor ID<input name="factor_id" required value="{{ factor.factor_id if factor else '' }}" {% if factor %}readonly{% endif %}></label>
<label>显示名称<input name="name" required value="{{ factor.name if factor else '' }}"></label>
<label class="wide">一行公式<textarea name="formula" required rows="3" spellcheck="false">{{ factor.formula if factor else '=' }}</textarea></label>
<label>经济假设 ID<input name="hypothesis_id" required value="{{ factor.hypothesis_id if factor else '' }}"></label>
<label>大类<input name="family" required value="{{ factor.family if factor else '' }}"></label>
<label>公式版本<input name="formula_version" value="{{ factor.formula_version if factor else '1.0' }}"></label>
<label>预期方向<select name="expected_direction">{% for item in ['unknown','positive','negative'] %}<option {% if factor and factor.expected_direction==item %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></label>
<label>技术状态<select name="status">{% for item in ['active','blocked','deprecated'] %}<option {% if factor and factor.status==item %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></label>
<label>标签（逗号分隔）<input name="tags" value="{{ factor.tags|join(', ') if factor else '' }}"></label>
<label class="wide">简介<textarea name="description" rows="4">{{ factor.description if factor else '' }}</textarea></label>
<div class="actions wide"><button class="button primary" type="submit">校验并保存</button><a class="button" href="{{ '/factors/' ~ factor.factor_id if factor else '/' }}">取消</a></div>
</form>{% endblock %}
