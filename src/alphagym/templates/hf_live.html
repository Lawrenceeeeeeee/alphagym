{% extends "base.html" %}
{% block title %}实时合约 · AlphaGYM{% endblock %}
{% block content %}
<section class="hero compact"><div><p class="eyebrow">LIVE DEMO TRADING</p><h1>BTC 合约实时策略</h1><p>{{ session_id }}</p></div><span id="connection" class="status running">正在读取</span></section>
<div id="warning" class="alert" hidden></div>
<section class="stats live-stats"><div><strong id="phase">—</strong><span>阶段</span></div><div><strong id="samples">0</strong><span>1 秒样本</span></div><div><strong id="predictions">0</strong><span>模型预测</span></div><div><strong id="roundtrips">0</strong><span>完成交易</span></div><div><strong id="net-pnl">0</strong><span>累计净盈亏 USDT</span></div><div><strong id="fees">0</strong><span>累计手续费 USDT</span></div><div><strong id="win-rate">—</strong><span>净胜率</span></div></section>
<section class="grid two"><div class="panel"><h2>策略状态</h2><dl id="facts"></dl></div><div class="panel"><h2>预测边际（bps）</h2><div id="edge-chart" class="live-chart"></div></div></section>
<section class="panel"><h2>逐笔收益</h2><div class="table-wrap"><table><thead><tr><th>交易</th><th>方向</th><th>开仓 → 平仓</th><th>持有</th><th>毛盈亏</th><th>手续费</th><th>净盈亏</th><th>净收益 bps</th><th>累计盈亏</th></tr></thead><tbody id="round-trip-rows"><tr><td colspan="9">暂无完整交易</td></tr></tbody></table></div></section>
<section class="panel"><h2>实时日志</h2><div id="events" class="live-events"></div></section>
<script>
const sessionId={{ session_id|tojson }};let chart;const text=(id,v)=>document.getElementById(id).textContent=v??'—';const time=v=>v?new Date(v).toLocaleTimeString('zh-CN',{hour12:false}):'—';function details(v){try{return JSON.parse(v||'{}')}catch(_){return {}}}
function render(d){const s=d.status,b=document.getElementById('connection'),w=document.getElementById('warning'),fmt=v=>(v>=0?'+':'')+Number(v).toFixed(6);b.textContent=d.stalled?'心跳已停止':(s.status==='running'?'运行中':s.status);b.className='status '+(d.stalled?'failed':s.status);w.hidden=!d.stalled&&!s.error;w.textContent=d.stalled?`后台心跳已中断 ${d.stale_seconds} 秒，进程可能退出。`:(s.error?.message||'');text('phase',d.stalled?'已中断':s.phase);text('samples',d.samples);text('predictions',d.signals.length);text('roundtrips',d.round_trips.length);text('net-pnl',fmt(d.pnl.net_usdt));text('fees',Number(d.pnl.fees_usdt).toFixed(6));text('win-rate',d.pnl.win_rate==null?'—':(d.pnl.win_rate*100).toFixed(1)+'%');document.getElementById('facts').innerHTML=[['标的',s.instrument_id],['模型',s.method],['预测周期',s.horizon_seconds+' 秒'],['订单规模',(s.order_size_contracts||s.quantity_btc)+' 张'],['入场信号 / 订单',s.signals+' / '+s.orders],['开始时间',time(s.started_at)],['最后心跳',time(s.updated_at)]].map(x=>`<dt>${x[0]}</dt><dd>${x[1]??'—'}</dd>`).join('');document.getElementById('events').innerHTML=d.events.slice().reverse().map(e=>`<div><time>${time(e.at)}</time><b>${e.message}</b><small>${Object.entries(details(e.details)).map(x=>x[0]+': '+x[1]).join(' · ')}</small></div>`).join('')||'<p>暂无日志</p>';document.getElementById('round-trip-rows').innerHTML=d.round_trips.slice().reverse().map(t=>`<tr><td>#${t.trade_id}</td><td>${t.direction}</td><td>${Number(t.open_price).toFixed(1)} → ${Number(t.close_price).toFixed(1)}</td><td>${t.holding_seconds}s</td><td>${fmt(t.gross_pnl_usdt)}</td><td>${Number(t.fees_usdt).toFixed(6)}</td><td class="${t.net_pnl_usdt<0?'negative':''}">${fmt(t.net_pnl_usdt)}</td><td>${Number(t.net_return_bps).toFixed(3)}</td><td>${fmt(t.cumulative_pnl_usdt)}</td></tr>`).join('')||'<tr><td colspan="9">暂无完整交易</td></tr>';if(!chart&&window.echarts)chart=echarts.init(document.getElementById('edge-chart'));if(chart)chart.setOption({tooltip:{trigger:'axis'},legend:{data:['做多','做空','阈值']},grid:{left:48,right:20,top:38,bottom:35},xAxis:{type:'category',data:d.signals.map(x=>time(x.ts))},yAxis:{type:'value',name:'bps'},series:[{name:'做多',type:'line',showSymbol:false,data:d.signals.map(x=>x.predicted_long_bps)},{name:'做空',type:'line',showSymbol:false,data:d.signals.map(x=>x.predicted_short_bps)},{name:'阈值',type:'line',showSymbol:false,lineStyle:{type:'dashed'},data:d.signals.map(x=>x.threshold_bps)}]})}
async function refresh(){try{const r=await fetch(`/api/hf/live/${sessionId}`,{cache:'no-store'});render(await r.json())}catch(_){text('connection','读取失败')}}window.addEventListener('resize',()=>chart?.resize());window.addEventListener('load',()=>{refresh();setInterval(refresh,3000)});
</script>
{% endblock %}
