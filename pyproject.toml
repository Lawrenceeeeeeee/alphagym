[build-system]
requires = ["hatchling>=1.25", "editables>=0.5"]
build-backend = "hatchling.build"

[project]
name = "mlquant"
version = "0.2.0"
description = "Point-in-time A-share factor research in the Huatai style"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "clickhouse-connect>=0.10,<1",
  "jinja2>=3.1,<4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "pyarrow>=18,<27",
  "PyYAML>=6,<7",
  "scipy>=1.13,<2",
]

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "python-multipart>=0.0.20,<1", "uvicorn>=0.34,<1"]
ml = ["scikit-learn>=1.5,<2"]
boosting = ["mlquant[ml]", "xgboost>=2.1,<4", "lightgbm>=4.5,<5"]
pdf = ["reportlab>=4.2,<5"]
all = ["mlquant[web,boosting,pdf,data]"]
data = ["tushare>=1.4,<2"]
research = ["vectorbt==1.1.0"]
dev = ["mlquant[web,boosting,pdf]", "httpx>=0.27,<1", "build>=1.2,<2", "pytest>=8.3,<9", "pytest-cov>=5,<7", "ruff>=0.8,<1"]

[project.scripts]
mlquant = "mlquant.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mlquant"]

[tool.hatch.build.targets.sdist]
include = ["/src/mlquant", "/tests", "/scripts", "/docs", "/README.md", "/pyproject.toml",
           "/AGENTS.md", "/config/equity_research.yaml", "/config/report.example.yaml", "/qmt",
           "/compose.yaml", "/config/clickhouse-server.xml", "/config/storage.example.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["legacy"]
